  --teal:#0a7281; --maroon:#4c012d;
  --r-sm:18px; --r-md:24px; --r-lg:30px; --r-full:9999px;
  --s-xs:4px; --s-sm:8px; --s-md:12px; --s-lg:18px; --s-xl:24px; --s-xxl:30px; --s-sec:48px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  word-break:keep-all;overflow-wrap:break-word;text-wrap:pretty;
  background:var(--canvas);color:var(--ink);
  font-family:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,
    "Helvetica Neue","Apple SD Gothic Neo","Noto Sans KR","맑은 고딕",sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum";
}
.wrap{margin:0 auto;background:var(--canvas);min-height:100vh}
header .htop,main{max-width:680px;margin-left:auto;margin-right:auto}

/* ── 상단: utility bar + 진행 ── */
header{position:sticky;top:0;z-index:30;background:var(--canvas);
  padding-top:env(safe-area-inset-top);
  box-shadow:inset 0 -1px 0 var(--hair-soft)}
.hzbar{display:none}
.htop{display:flex;align-items:center;gap:12px;padding:14px 24px 13px}
h1{margin:0;font-size:16px;font-weight:500;letter-spacing:0;color:var(--ink)}
.step{margin-left:auto;font-size:12px;font-weight:500;color:var(--mute)}
button.reset{margin-left:auto;border:none;background:var(--cloud);color:var(--ash);
  font:inherit;font-size:13px;font-weight:500;padding:8px 14px;border-radius:var(--r-full);
  cursor:pointer;letter-spacing:-.02em}
button.reset:active{opacity:.6}
button.reset[hidden]{display:none}
.bar{height:2px;background:var(--hair-soft)}
.bar i{display:block;height:100%;background:var(--ink);width:0;
  transition:width .4s cubic-bezier(.4,0,.2,1)}

main{padding:var(--s-xl) 24px calc(56px + env(safe-area-inset-bottom))}

/* ── 질문 ── */
.q{font-size:44px;font-weight:500;letter-spacing:-.035em;margin:0 0 var(--s-md);line-height:.95}
.qs{font-size:16px;font-weight:500;color:var(--mute);margin:0 0 var(--s-xxl);line-height:1.5}
.opts{display:flex;flex-direction:column;gap:var(--s-xs)}
button.opt{display:block;width:100%;text-align:left;cursor:pointer;position:relative;
  background:var(--cloud);border:none;border-radius:var(--r-md);
  padding:18px 60px 18px 24px;font:inherit;color:var(--ink);
  transition:background .15s,transform .1s;min-height:48px}
button.opt:active{transform:scale(.99)}
button.opt.on{background:var(--ink);color:var(--on-ink)}
button.opt b{display:block;font-weight:500;font-size:20px;letter-spacing:-.025em;line-height:1.35}
button.opt span{display:block;font-size:14px;font-weight:500;color:var(--mute);
  margin-top:4px;line-height:1.45}
button.opt.on span{color:rgba(255,255,255,.62)}
/* swatch-dot 방식 선택 표시 */
button.opt .chk{position:absolute;right:24px;top:50%;margin:-11px 0 0;width:22px;height:22px;
  border-radius:var(--r-full);background:var(--on-ink);opacity:0;font-size:0;
  display:block;transition:opacity .12s}
button.opt .chk:after{content:"";position:absolute;left:8px;top:5.5px;width:5px;height:10px;
  border:solid var(--ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
button.opt.on .chk{opacity:1}

.actions{display:flex;gap:var(--s-sm);margin-top:var(--s-xl)}
button.go{flex:1;height:48px;padding:0 32px;border:none;border-radius:var(--r-full);
  background:var(--ink);color:var(--on-ink);font:inherit;font-size:16px;font-weight:500;cursor:pointer}
button.go:active{opacity:.5;transform:scale(.98)}
button.back{height:48px;padding:0 32px;border:none;border-radius:var(--r-full);
  background:var(--cloud);color:var(--ink);font:inherit;font-size:16px;font-weight:500;cursor:pointer}

/* ── 사고 락업 (hero) ── */
.sign{background:var(--cloud);border-radius:var(--r-md);position:relative;overflow:hidden;
  padding:var(--s-xl);margin-bottom:var(--s-xl);--c:var(--ink)}
.sign.urgent{padding-left:calc(var(--s-xl) + 6px)}
.sign.urgent:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.sign.t-fire{--c:var(--sale)}
.sign.t-water{--c:var(--info)}
.sign.t-break{--c:var(--teal)}
.sign.t-body{--c:var(--maroon)}
.sign .band{display:none}
.sign .head{display:flex;align-items:center;gap:var(--s-md)}
.sign .ic{flex:none;width:44px;height:44px;display:flex;align-items:center;
  justify-content:center;margin-top:4px}
.sign .ic svg{width:44px;height:44px;stroke:var(--c);fill:none;stroke-width:1.4;
  stroke-linecap:round;stroke-linejoin:round}
.sign .tt{min-width:0}
.sign .kind{display:block;font-size:48px;font-weight:500;letter-spacing:-.04em;line-height:.95}
em.hl{font-style:normal;font-weight:500;color:var(--c,var(--ink))}
.sign .d em.hl{font-size:1.06em}
.sign .ic{margin-top:0}
.sign .lvl{margin-top:0}
.sign .d{font-size:16px;font-weight:500;line-height:1.5;color:var(--ash);margin-top:var(--s-lg);text-wrap:pretty}
.dept{display:flex;flex-wrap:wrap;gap:var(--s-sm);margin-top:var(--s-lg)}
.dept span{font-size:13px;font-weight:500;padding:7px 14px;border-radius:var(--r-full);
  background:var(--canvas);color:var(--stone);white-space:nowrap}
.dept span.on{background:var(--c,var(--ink));color:var(--on-ink)}

.facts{margin:var(--s-lg) 0 0;padding:0;border-top:1px solid var(--hair)}
.facts>div{display:flex;gap:var(--s-md);align-items:baseline;
  padding:10px 0;border-bottom:1px solid var(--hair-soft)}
.facts>div:last-child{border-bottom:none;padding-bottom:0}
.facts dt{flex:none;width:88px;margin:0;font-size:13px;font-weight:500;color:var(--stone)}
.facts dd{margin:0;font-size:14px;font-weight:500;color:var(--ash);line-height:1.45}

/* ── 탭: primary-nav 방식 (2px ink 언더라인) ── */
.tabs{display:flex;gap:4px;position:sticky;top:59px;z-index:20;background:var(--canvas);
  padding:8px 0 12px;margin:0 0 var(--s-lg)}
button.tab{flex:1;height:44px;border:none;background:var(--cloud);border-radius:var(--r-full);
  font:inherit;font-size:15px;font-weight:500;color:var(--ash);cursor:pointer;
  padding:0 4px;letter-spacing:-.03em;transition:background .15s,color .15s}
button.tab.on{background:var(--ink);color:var(--on-ink)}
.res.t-fire .tab.on{background:var(--sale)}
.res.t-water .tab.on{background:var(--info)}
.res.t-break .tab.on{background:var(--teal)}
.res.t-body .tab.on{background:var(--maroon)}
button.tab i{font-style:normal;font-size:12px;font-weight:500;color:var(--stone);margin-left:3px}
button.tab.on i{color:rgba(255,255,255,.6)}

.prog{margin:0 0 var(--s-xl)}
.prog .pt{display:flex;align-items:baseline;font-size:24px;font-weight:500;
  letter-spacing:-.02em;color:var(--ink);margin-bottom:var(--s-sm)}
.prog .pt b{font-weight:500}
.prog .pt i{font-style:normal;color:var(--hair);margin:0 4px}
.prog .pt span{margin-left:auto;font-size:14px;font-weight:500;color:var(--mute)}
.prog .pb{height:4px;background:var(--cloud);border-radius:var(--r-full);overflow:hidden}
.res.t-fire .prog .pb i{background:var(--sale)}
.res.t-water .prog .pb i{background:var(--info)}
.res.t-break .prog .pb i{background:var(--teal)}
.res.t-body .prog .pb i{background:var(--maroon)}
.prog .pb i{display:block;height:100%;background:var(--ink);border-radius:var(--r-full);
  transition:width .3s cubic-bezier(.4,0,.2,1)}

.ln{display:block;text-wrap:pretty}
.hl{font-style:normal;font-weight:500;color:var(--c,var(--ink))}
.sign .hl{font-weight:500}
.ln + .ln{margin-top:3px}

/* ── 알림 ── */
.alert{background:var(--cloud);border-radius:var(--r-sm);padding:var(--s-lg) var(--s-xl);
  margin-bottom:var(--s-sm)}
.alert .t{font-size:16px;font-weight:500;line-height:1.5;margin-bottom:var(--s-sm);
  display:flex;align-items:center;gap:var(--s-md)}
.alert .d{font-size:14px;font-weight:500;color:var(--mute);line-height:1.5;text-wrap:pretty}
.alert.hard{background:var(--canvas);padding:0 0 var(--s-lg);border-bottom:1px solid var(--ink);
  border-radius:0;margin-bottom:var(--s-lg)}
.alert.hard{--c:var(--ink)}
.res.t-fire .alert.hard{--c:var(--sale)}
.res.t-water .alert.hard{--c:var(--info)}
.res.t-break .alert.hard{--c:var(--teal)}
.res.t-body .alert.hard{--c:var(--maroon)}
.alert.hard .t{color:var(--c);font-size:32px;font-weight:500;letter-spacing:-.02em;
  line-height:1.1;margin-bottom:var(--s-md)}
.alert.hard .d{color:var(--ash);font-size:16px}

.flist{list-style:none;margin:var(--s-md) 0 0;padding:0}
.flist li{padding:10px 0;border-top:1px solid var(--hair-soft)}
.flist li b{display:block;font-size:15px;font-weight:500;letter-spacing:-.02em;color:var(--ink)}
.flist li b i{font-style:normal;font-weight:500;color:var(--mute);font-size:13px}
.flist li span{display:block;font-size:14px;font-weight:500;color:var(--mute);
  line-height:1.5;margin-top:3px}

.flow{list-style:none;margin:var(--s-md) 0;padding:0;
  border-top:1px solid var(--hair-soft)}
.flow li{display:flex;align-items:center;gap:var(--s-md);padding:9px 0;
  border-bottom:1px solid var(--hair-soft);font-size:15px;font-weight:500}
.flow li em{font-style:normal;flex:none;width:24px;height:24px;border-radius:var(--r-full);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;
  color:var(--c,var(--ink));background:transparent;
  box-shadow:inset 0 0 0 1.5px var(--c,var(--ink))}
.flow li span{color:var(--ink)}

/* ── 제목 ── */
.subh{margin:var(--s-xxl) 0 var(--s-md);font-size:16px;font-weight:500;color:var(--ink);
  padding-bottom:var(--s-sm);border-bottom:1px solid var(--ink);display:flex;
  align-items:center;gap:var(--s-md)}
.subh em.n,.grp em.n,.alert .t em.n,.denywrap .dh em.n{font-style:normal;flex:none;
  font-size:11px;font-weight:500;line-height:1;color:var(--on-ink);
  background:var(--c,var(--ink));border-radius:var(--r-full);padding:4px 8px}

.res.t-fire{--c:var(--sale)} .res.t-water{--c:var(--info)}
.res.t-break{--c:var(--teal)} .res.t-body{--c:var(--maroon)}
.subh:first-child{margin-top:0}
.grp{margin:var(--s-xxl) 0 var(--s-md);display:flex;align-items:baseline;gap:var(--s-sm);
  padding-bottom:var(--s-sm);border-bottom:1px solid var(--ink)}

.grp b{font-size:16px;font-weight:500;color:var(--ink);line-height:1.5}
.grp span{font-size:12px;font-weight:500;color:var(--mute)}
.grp u{margin-left:auto;text-decoration:none;font-size:12px;font-weight:500;color:var(--stone)}
.grp hr{display:none}

/* ── 목록 ── */
.box{background:var(--canvas);border-radius:0}
.row{padding:var(--s-lg) 0;border-bottom:1px solid var(--hair-soft);font-size:16px;line-height:1.5}
.row:last-child{border-bottom:none}
.row .k{font-size:12px;font-weight:500;color:var(--mute);margin-bottom:var(--s-xs)}
.row .own{font-size:14px;font-weight:500;color:var(--mute);margin-top:var(--s-xs)}

.note{background:var(--cloud);border-radius:var(--r-sm);padding:var(--s-lg) var(--s-xl);
  font-size:14px;font-weight:500;color:var(--ash);line-height:1.5;margin:var(--s-md) 0}

/* ── 체크: swatch-dot 동심원 ── */
label.ck{display:flex;gap:var(--s-lg);align-items:flex-start;padding:var(--s-lg) 0;
  border-bottom:1px solid var(--hair-soft);cursor:pointer}
label.ck:last-child{border-bottom:none}
label.ck input{display:none}
label.ck .bx{flex:none;width:20px;height:20px;border-radius:var(--r-full);margin-top:2px;
  background:var(--canvas);box-shadow:0 0 0 1px var(--hair);transition:box-shadow .15s,background .15s}
label.ck input:checked + .bx{background:var(--ink);
  box-shadow:0 0 0 2px var(--canvas),0 0 0 4px var(--ink)}
label.ck .tx b{display:block;font-weight:500;font-size:16px;line-height:1.5}
label.ck .tx span{display:block;font-size:14px;font-weight:500;color:var(--mute);
  margin-top:2px;line-height:1.5}
label.ck input:checked ~ .tx b{color:var(--stone);text-decoration:line-through}
label.ck input:checked ~ .tx span{color:var(--stone)}

/* ── 대본 ── */
.say .stp{display:flex;align-items:baseline;gap:var(--s-md);margin-bottom:var(--s-sm)}
.say .stp em{font-style:normal;flex:none;font-size:13px;font-weight:500;
  color:var(--c,var(--ink));background:transparent;border-radius:var(--r-full);
  width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 0 1.5px var(--c,var(--ink))}
.say .stp b{font-size:17px;font-weight:500;letter-spacing:-.025em;line-height:1.35}
.say .when.sm{font-size:12px;color:var(--stone);margin:0 0 var(--s-md)}
.box.flow{position:relative}
.box.flow .say{padding-left:0}

.say{padding:var(--s-xl) 0;border-bottom:1px solid var(--hair-soft)}
.say:last-child{border-bottom:none}
.say .when{font-size:12px;font-weight:500;color:var(--mute);margin-bottom:var(--s-md)}
.say .line{font-size:16px;font-weight:500;line-height:1.5;background:var(--cloud);
  border-radius:var(--r-sm);padding:var(--s-lg) var(--s-xl);margin-bottom:var(--s-sm);color:var(--ink)}
.say .line:last-of-type{margin-bottom:0}
.say .no{font-size:14px;font-weight:500;color:var(--mute);margin-top:var(--s-md);line-height:1.5;text-wrap:pretty}

/* 하면 안 되는 말 — 맨 위 */
.denywrap{margin-bottom:var(--s-xxl)}
.denywrap .dh{font-size:20px;font-weight:500;letter-spacing:-.03em;color:var(--sale);
  margin-bottom:var(--s-md);display:flex;align-items:center;gap:var(--s-md)}
.denywrap .row{padding-top:var(--s-md);padding-bottom:var(--s-md)}

/* 답변 대상 아님 */
.deny .row{padding-left:32px;position:relative}
.deny .row:before{content:"";position:absolute;left:0;top:15px;width:16px;height:16px;
  border-radius:var(--r-full);box-shadow:inset 0 0 0 1.5px var(--c,var(--ink));
  background:linear-gradient(to bottom right,transparent 43%,var(--c,var(--ink)) 43%,var(--c,var(--ink)) 57%,transparent 57%)}
.deny{--c:var(--sale)}

/* ── 도구 ── */
.tools{display:flex;flex-direction:column;gap:var(--s-sm);margin-top:var(--s-xxl)}
.tools button{height:48px;padding:0 32px;border:none;border-radius:var(--r-full);
  background:var(--cloud);color:var(--ink);font:inherit;font-size:16px;font-weight:500;cursor:pointer}
.tools button.primary{background:var(--ink);color:var(--on-ink)}
.tools button:active{opacity:.5;transform:scale(.98)}

.foot{margin-top:var(--s-xxl);padding-top:var(--s-lg);border-top:1px solid var(--hair);
  font-size:9px;font-weight:500;line-height:1.75;color:var(--mute);
  display:flex;justify-content:space-between;gap:var(--s-md)}
.soon{text-align:center;padding:var(--s-sec) 16px;color:var(--mute);font-size:16px;line-height:1.5}

.ask{position:fixed;inset:0;z-index:80;background:rgba(17,17,17,.4);
  display:flex;align-items:center;justify-content:center;padding:24px}
.ask-in{background:var(--canvas);border-radius:var(--r-md);padding:var(--s-xl);
  width:100%;max-width:340px}
.ask-t{font-size:19px;font-weight:500;letter-spacing:-.03em;margin-bottom:var(--s-sm)}
.ask-d{font-size:14px;font-weight:500;color:var(--mute);line-height:1.5;margin-bottom:var(--s-xl)}
.ask-b{display:flex;gap:var(--s-sm)}
.ask-b button{flex:1;height:48px;border:none;border-radius:var(--r-full);
  font:inherit;font-size:16px;font-weight:500;cursor:pointer}
.ask-no{background:var(--cloud);color:var(--ink)}
.ask-yes{background:var(--ink);color:var(--on-ink)}
.ask-b button:active{opacity:.6}

/* ── 첫 화면 원칙 ── */
.intro{margin-top:var(--s-sec)}
.ir{display:flex;gap:var(--s-lg);padding:var(--s-lg) 0;border-bottom:1px solid var(--hair-soft)}
.ir:first-child{border-top:1px solid var(--ink)}
.ir:last-child{border-bottom:none}
.ir em{font-style:normal;font-size:9px;font-weight:500;line-height:1.75;color:var(--mute);
  flex:none;width:16px;padding-top:3px}
.ir b{display:block;font-size:16px;font-weight:500;line-height:1.5}
.ir span{display:block;font-size:14px;font-weight:500;color:var(--mute);line-height:1.5}

/* ── 넓은 화면: 좌측 고정 락업 + 세로 탭, 우측 본문 ── */
@media (min-width:1000px){
  header .htop{max-width:1160px;padding-left:40px;padding-right:40px}
  main{max-width:1160px;padding:var(--s-sec) 40px 72px}
  .res{display:grid;grid-template-columns:320px 1fr;gap:var(--s-sec);align-items:start}
  .side{position:sticky;top:112px}
  .side .sign{margin-bottom:var(--s-xl)}
  .side .sign .kind{font-size:44px}
  .tabs{display:flex;flex-direction:column;align-items:flex-start;gap:var(--s-sm);
    position:static;padding:0;margin:var(--s-xl) 0 0}
  button.tab{display:inline-flex;align-items:center;justify-content:flex-start;
    width:auto;flex:0 0 auto;height:56px;padding:0 26px;text-align:left;
    border-radius:var(--r-full);font-size:17px}
  button.tab i{margin-left:12px}
  .side{top:100px}
  .panel{min-width:0}
  .panel .subh:first-child,.panel .grp:first-child{margin-top:0}
  .tools{flex-direction:row;flex-wrap:wrap}
  .tools button{flex:1;min-width:180px}
  /* 질문 화면 2열 */
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-md)}
  .q{font-size:56px}
  .intro{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:var(--s-xl);
    border-top:1px solid var(--ink);padding-top:var(--s-xl)}
  .ir{border-bottom:none;padding:0;flex-direction:column;gap:var(--s-sm)}
  .ir:first-child{border-top:none}
}
@media (min-width:1000px) and (max-width:1200px){
  .res{grid-template-columns:280px 1fr;gap:var(--s-xxl)}
}



.printdoc{display:none}
@media print{
  header,.tabs,.tools,.actions{display:none}
  .res{display:block}
  body.printing main>.res>.panel{display:none}
  body.printing .printdoc{display:block;padding:0 4mm}
  .pchunk{break-inside:auto;margin-bottom:6mm}
  .pchunk:first-child{margin-top:0}
  .pchunk .ph{font-size:15pt;font-weight:500;letter-spacing:-.02em;margin:0 0 4mm;
    padding-bottom:2mm;border-bottom:1.5pt solid var(--ink);break-after:avoid}
  .say,.row,label.ck,.alert,.box{break-inside:avoid}
  .sign{break-inside:avoid;margin-bottom:6mm;padding:6mm;border-radius:3mm}
  .sign .kind{font-size:22pt}
  body.printing main{padding:0}
  body.printing .wrap{min-height:0}
  body.printing .side{position:static}
  .say .line{padding:3mm 4mm}
  label.ck,.row{padding-top:2.5mm;padding-bottom:2.5mm}
  .subh,.grp{margin-top:5mm;margin-bottom:2mm}
  .note,.alert{padding:3mm 4mm;margin:2mm 0}
  .prog{margin-bottom:4mm}
  @page{margin:12mm 10mm}
}
@media (min-width:700px){ main{padding:var(--s-xxl) 32px 64px} .htop{padding:16px 32px 14px} }
@media (max-width:400px){ .sign .kind{font-size:38px} .sign .ic,.sign .ic svg{width:36px;height:36px} .q{font-size:36px} .alert.hard .t{font-size:26px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="htop">
    <h1 id="hTitle">사고 현장 대응 가이드</h1>
    <div class="step" id="hStep"></div>
    <button class="reset" id="hReset" hidden>처음부터</button>
  </div>
  <div class="bar"><i id="hBar"></i></div>
</header>

<main id="app"></main>

</div>

const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function progress(){
  const O = order(), i = O.indexOf(node);
  const bar = document.getElementById('hBar'), st = document.getElementById('hStep');
  if (node==='result' || node==='soon'){ bar.style.width='100%'; st.textContent=''; return; }
  const j = i<0 ? O.indexOf('side') : i;      // work 등 중간 노드
  bar.style.width = (j/O.length*100)+'%';
  st.textContent = (j+1)+' / '+O.length;
}

function renderQ(){
  const d = Q[node], cur = S[d.key];
  const on = v => d.multi ? (cur||[]).includes(v) : cur === v;
  app.innerHTML =
    '<p class="q">'+esc(d.q)+'</p>'+(d.s?'<p class="qs">'+esc(d.s)+'</p>':'<div style="height:14px"></div>')+
    '<div class="opts">'+
    d.opts.map(o=>'<button class="opt'+(on(o.v)?' on':'')+'" data-v="'+esc(o.v)+'">'+
      '<span class="chk"></span><b>'+esc(o.t)+'</b>'+(o.d?'<span>'+esc(o.d)+'</span>':'')+'</button>').join('')+
    '</div><div class="actions">'+
      (stack.length?'<button class="back" id="bBack">이전</button>':'')+
      (d.multi?'<button class="go" id="bNext">다음</button>':'')+
    '</div>';
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const v=b.dataset.v;
    if(d.multi){
      const a=S[d.key]||[];
      if(v==='none') S[d.key]=a.includes('none')?[]:['none'];
      else{
        const b=a.filter(x=>x!=='none');
        S[d.key]=b.includes(v)?b.filter(x=>x!==v):b.concat([v]);
      }
      renderQ();
    } else {
      S[d.key] = (v!=='' && !isNaN(Number(v))) ? Number(v) : v;
      stack.push(node); node=d.next(v); render();
    }
  });
  const bn=document.getElementById('bNext'); if(bn) bn.onclick=()=>{ stack.push(node); node=d.next(); render(); };
  const bb=document.getElementById('bBack'); if(bb) bb.onclick=()=>{ node=stack.pop(); render(); };
  if(node==='type'){
    app.insertAdjacentHTML('beforeend',
      '<div class="intro">'+
      '<div class="ir"><em>1</em><div><b>판단보다 사실 확인이 먼저입니다</b><span>원인과 귀책은 관계기관 조사와 유관부서 검토로 정해집니다. 현장에서는 확인된 사실과 증빙 자료를 확보하는 것이 중요합니다.</span></div></div>'+
      '<div class="ir"><em>2</em><div><b>조치 전 원래 상태를 남기는 것이 중요합니다</b><span>정리하거나 조치한 뒤에는 당시 상태를 다시 확인할 수 없습니다. 촬영이 먼저입니다.</span></div></div>'+
      '<div class="ir"><em>3</em><div><b>현장에서는 책임 · 보상과 관련한 언급을 피해주세요</b><span>보상 · 기한 · 처리 방향은 유관부서와의 협의와 검토 후에 정해지는 부분입니다. 현장에서는 언급을 피해주시고, 최대한 빠르게 검토 후 다시 연락드리겠다고 전달해주세요.</span></div></div>'+
      '</div>');
  }
}

function buildFire(){
  const f=S.flags||[], wh=S.when, inj=(S.injury==='y');
  const B={alerts:[], now:'', shots:[], shotNotes:[], says:[], report:[]};

  if(inj) B.alerts.push({t:"인명피해 건", d:"즉시 유선상으로 물류담당자 · 담당 LM에게 사고 사항을 공유한 후 후속 조사를 진행해주세요.", hard:true});

  let n='';
  if(inj) n+=sub('유선으로 먼저 확인')+box([
    row('','인원 수 · 병원 이송 여부 · 이송 병원','상해 정도는 판단하지 않고 사실만 전달'),
    row('','화재 규모 — 소규모 / 세대 내 확산 / 인접 세대 확산'),
    row('','고객 인적사항 · 모델명 · 제조번호')]);
  n+=sub('확보')+box([
    row('1순위','실내기 명판의 모델명 · 제조번호','실외기는 소실 가능성 높음'),
    (wh==='told'?row('서비스 통보 건','통보 시점에 제조번호 동시 요청','이후 재요청이 어려움'):''),
    row('대조용','주문자 성명 · 연락처','배우자 명의 포함'),
    row('가능한 경우','설치 주문번호','고객 보유 문자 · 영수증에서 확인되면 조회가 빠름'),
    row('확보 불가 시','해당 사실을 그대로 공유')])+
    note('제품에 설치 스티커가 부착되어 있더라도 당사 설치 여부는 전산 확인이 필요합니다. 판토스 설치 여부는 유관부서 확인을 통해 확정해야 합니다.');
  B.now=n;

  if(wh==='inv') B.shotNotes.push('조사기관이 잔존물을 수거한 경우 결선부는 확인이 어렵습니다. 소훼 흔적은 남아 있으므로 나머지는 그대로 확인해주세요.');
  if(wh==='self') B.shotNotes.push('소방 미출동 건은 현장이 보존된 상태로, 이후 원인 확인의 유일한 자료가 됩니다. 규모와 무관하게 촬영 후 공유해주세요.');
  if(wh==='told') B.shotNotes.push('현장이 정리되었을 수 있습니다. 확인되지 않는 항목은 서비스 점검 자료로 확보해야 하므로 그 사실을 공유해주세요.');
  SHOTS_F.filter(g=>g.need.includes(wh)||(g.soft||[]).includes(wh)).forEach(g=>{
    B.shots.push({g:g.g, n:(g.soft||[]).includes(wh)?'확인 가능한 범위에서':'', items:g.items});
  });

  B.says=SAY_F.filter(s=>{
    if(s.flag) return f.includes(s.flag);
    if(s.inj) return inj;
    if(s.noInj&&inj) return false;
    if(s.show) return s.show.includes(wh);
    return true;
  });
  B.reportExtra = wh==='inv' ? ' · 조사 진행 여부와 담당 기관' : '';
  return B;
}

function buildWater(){
  const f=S.flags||[], pr=S.prod, sd=S.side||'out', isWork=(pr==='work');
  const B={alerts:[], now:'', shots:[], shotNotes:[], says:[], report:[]};

  if((S.flags||[]).includes('voc') || (S.flags||[]).includes('third'))
    B.alerts.push({t:"대외 확산 예상 건",
      d:"외부기관 접촉 또는 소비자원 · 법적 대응이 언급된 건입니다. 피해 금액이 ⟪자기부담금 기준⟫ 이하로 예상되더라도 물류 자체 처리 대상이 아닙니다. Line팀을 경유해 LMD 설치품질팀까지 공유합니다."});
  if(!(S.flags||[]).includes('voc') && !(S.flags||[]).includes('third'))
    B.alerts.push({t:"규모 판단은 물류에서",
      d:"현장에서는 확인한 내용을 물류에 공유합니다. 피해 규모는 물류에서 1차 확인합니다. 피해 금액이 ⟪자기부담금 기준⟫을 넘을 것으로 예상되면 Line팀 이상으로 공유합니다. 규모 판단이 어려운 경우에도 Line팀을 경유해 유관부서로 공유합니다."});
  B.alerts.push({t:"조치 전에 남길 것",
    steps:["밸브 잠금","조치 전 촬영","재현","원인 확인","조치","조치 후 확인"],
    d:"조치하고 나면 원래 상태는 다시 만들 수 없습니다. 촬영 전 재체결 · 부품 교체는 하지 않습니다.", hard:true});
  if(isWork && (S.ord==='n'||S.ord==='?'))
    B.alerts.push({t:"처리 경로 확인 필요", d:"주문 연계가 확인되지 않는 단독 작업 건입니다. 처리 방향은 유관부서 검토 사항으로, 현장에서 처리 · 보상 관련 안내를 하지 않습니다. 주문번호 · 작업 접수 경로가 확인되면 함께 공유해주세요."});
  if(f.includes('done'))
    B.alerts.push({t:"조치 완료 후 접수", d:"조치 전 사진 · 조치 내역이 남아 있는지 먼저 확인하고, 없으면 그 사실을 그대로 공유해주세요."});

  B.now=sub('확보')+box([
    row('1순위','제품 명판의 모델명 · 제조번호'),
    row('대조용','주문자 성명 · 연락처','배우자 명의 포함'),
    row('가능한 경우','설치 주문번호 · 작업일자','고객 보유 문자 · 영수증에서 확인되면 조회가 빠름'),
    (isWork?row('작업 접수 경로','주문 연계 여부 · 접수 경로','제품 설치 주문에 포함된 작업인지, 작업만 단독으로 접수된 건인지'):''),
    (S.spread===3?row('고객 측 담보','일상생활배상책임 담보 가입 여부','화재보험 · 주택종합보험 특약으로 가입된 경우가 많음. 가입 여부만 확인'):''),
    row('확보 불가 시','해당 사실을 그대로 공유')]);

  B.shotNotes.push('각 단계마다 전경을 먼저 찍고 근접으로 들어가십시오. 근접만 있으면 위치와 범위가 확인되지 않습니다.');
  B.shots.push({g:'조치 전', n:'손대기 전에', items:[
    { t:"실내 전경", d:"누수 위치가 집 안 어디인지 확인되게. 여러 방향에서" },
    { t:"제품 및 주변 설치 상태 전경", d:"제품과 체결부 · 배관이 함께 보이게" },
    { t:"물이 고인 범위 · 젖은 자국 경계", d:"경계가 어디까지인지 바닥 · 벽면 전체가 들어오게" },
    { t:"누수 발생 지점 근접", d:"전경을 찍은 뒤에" },
  ]});

  if(isWork){
    B.shots.push({g:'작업 부위', n:T_WORK[S.work]||'', items:WORK_SHOTS});
    B.shotNotes.push('기존 설비를 취급하는 작업입니다. 작업 전 상태가 남아 있지 않으면 파손이 작업으로 생긴 것인지 기존 것인지 확인할 방법이 없습니다.');
  } else {
    if(sd==='in'||sd==='both'||sd==='?')
      B.shots.push({g:'급수부', n:T_PROD[pr], items:(IN_BY_PROD[pr]||[]).concat([
        { t:"어댑터 파손 · 균열 · 패킹 상태" },
        { t:"기존 분배기 · 원수 급수부 재체결 지점", d:"당사가 분리 후 재체결한 부분과 벽체 배관의 경계가 보이게" }])});
    if(sd==='out'||sd==='both'||sd==='?')
      B.shots.push({g:'배수부', n:T_PROD[pr], items:OUT_BY_PROD[pr]||[]});
  }

  B.shots.push({g:'재현', n:'영상', items:[
    { t:"급수 재현", d:"물을 흘리며 누수 지점이 보이도록 영상 촬영", skipIf:'out' },
    { t:"배수 재현", d:"배수 동작 중 누수 · 역류 여부를 영상 촬영" },
    { t:"누수 지점 특정", d:"물이 나오기 시작하는 지점 근접" },
    { t:"재현되지 않는 경우", d:"시도한 조건(급수 · 배수 · 반복 횟수)을 기록" },
  ].filter(x=>!(x.skipIf&&sd===x.skipIf))});

  B.shots.push({g:'배관 · 역류 확인', items:[
    { t:"역류 발생 여부", d:"배수구에서 물이 올라오는 상태" },
    { t:"배수구 주변 오염 · 이물", d:"슬러지 · 침전물" },
    { t:"배관 내부", d:"내시경 확인이 가능한 경우. 어려우면 '장비 없음'으로 기록" },
  ]});
  B.shotNotes.push('매립배수관에서 역류가 확인되면 배관 내부 상태까지 확인해주세요. 배관 내부는 당사 시공 범위 밖의 원인을 확인할 수 있는 유일한 자료입니다.');

  B.shots.push({g:'조치', items:[
    { t:"조치 내역 기록", d:"무엇을 어떻게 조치했는지. 교체 부품이 있으면 함께" },
    { t:"조치 후 상태" },
    { t:"조치 후 재현으로 해소 확인", d:"해소되지 않으면 그 사실을 즉시 공유" },
  ]});
  B.shots.push({g:'피해 범위', items:[
    { t:"세대 내 피해 범위", d:"바닥 · 벽 · 가구 · 가전. 방마다 전경 1매 이상, 젖은 자국 경계가 보이게" },
    ...(S.spread===3?[{ t:"아랫집 · 인접 세대 피해", d:"방문이 가능한 경우. 어려우면 그 사실을 기록" }]:[]),
  ]});

  B.says=SAY_W.filter(s=>{
    if(s.flag) return f.includes(s.flag);
    if(s.spread3) return S.spread===3;
    if(s.solo) return isWork && (S.ord==='n'||S.ord==='?');
    return true;
  });
  B.reportExtra=' · 조치 내역';
  return B;
}

function chips(){
  const c=[];
  if(S.type==='fire'){
    c.push(['규모', T_SCALE[S.scale]]);
    c.push(['인명피해', S.injury==='y' ? (T_HARM[S.harm]||'있음') : '없음']);
    c.push(['확인 시점', T_WHEN[S.when]]);
  } else if(S.type==='water'){
    c.push(['제품 · 작업', T_PROD[S.prod]+(S.prod==='work'&&T_WORK[S.work]?' · '+T_WORK[S.work]:'')]);
    if(S.prod==='work') c.push(['주문 연계', {y:'주문 포함',n:'단독 작업','?':'미확인'}[S.ord]]);
    else c.push(['누수 계통', T_SIDE[S.side]]);
    c.push(['피해 범위', T_SPREAD[S.spread]]);
  } else if(S.type==='break'){
    c.push(['피해 대상', T_TARGET[S.target]], ['확인 시점', T_FOUND[S.found]]);
  } else if(S.type==='body'){
    c.push(['피해 정도', T_HARM[S.harm]]);
  }
  const og=(S.org||[]).map(x=>T_ORG[x]).filter(Boolean);
  const f=(S.flags||[]).map(x=>x==='third'&&og.length ? T_FLAG[x]+'('+og.join(', ')+')' : T_FLAG[x]).filter(Boolean);
  c.push(['특이사항', f.length?f.join(' · '):'없음']);
  return c.filter(x=>x[1]);
}

function bindTabs(){
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
    TAB=b.dataset.k;
    document.querySelectorAll('.tab').forEach(x=>x.className='tab'+(x.dataset.k===TAB?' on':''));
    const p=document.getElementById('panel'); p.innerHTML=panelHTML(); bindPanel();
    window.scrollTo(0,0);
  });
}
function bindPanel(){
  document.querySelectorAll('.ck input').forEach(inp=>inp.onchange=()=>{
    CK[inp.dataset.id]=inp.checked;
    const n=BUILT.shots.reduce((a,g)=>a+g.items.length,0);
    const d=Object.values(CK).filter(Boolean).length;
    const t=document.querySelector('.tab[data-k="shot"] i'); if(t) t.textContent=d+'/'+n;
    const pd=document.getElementById('pDone'); if(pd) pd.textContent=d;
    const pl=document.getElementById('pLeft'); if(pl) pl.textContent = d===n?'모두 확인':(n-d)+'개 남음';
    const pb=document.getElementById('pBar'); if(pb) pb.style.width=(n?d/n*100:0)+'%';
    document.querySelectorAll('.grp[data-ids]').forEach(g=>{
      const ids=g.dataset.ids.split(',');
      const u=g.querySelector('u'); if(u) u.textContent=ids.filter(x=>CK[x]).length+'/'+ids.length;
    });
  });

  const p=document.getElementById('bPrint');
  if(p) p.onclick=()=>buildPrint();
}

    body+

    '<span>LMD 설치품질팀</span></div>'+
    '</div>'+
    '<script>window.onload=function(){setTimeout(function(){window.print();},400);};<\/script>'+
    '</body></html>';

  const w=window.open('','_blank');
  if(w){
    w.document.open(); w.document.write(html); w.document.close();
    // 체크 상태 반영
    setTimeout(()=>{ try{
      w.document.querySelectorAll('.ck input').forEach(inp=>{ if(CK[inp.dataset.id]) inp.checked=true; });
    }catch(e){} }, 200);
    return;
  }
  // 새 창이 막힌 경우 — 파일로 내려받아 열도록 안내
  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=kind+'_대응기록.html';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

/* 복사가 막힌 환경에서는 화면에 띄워 직접 복사 */
function bindReset(){
  const r=document.getElementById('hReset');
  if(!r) return;
  r.hidden = (node!=='result');
  r.onclick=()=>askReset();
}

function askReset(){
  if(document.querySelector('.ask')) return;
  const w=document.createElement('div');
  w.className='ask';
  w.innerHTML='<div class="ask-in">'+
    '<div class="ask-t">처음부터 다시 하시겠습니까?</div>'+
    '<div class="ask-d">선택한 내용과 촬영 체크가 모두 지워집니다.</div>'+
    '<div class="ask-b"><button class="ask-no">취소</button>'+
    '<button class="ask-yes">처음부터</button></div></div>';
  document.body.appendChild(w);
  const close=()=>w.remove();
  w.querySelector('.ask-no').onclick=close;
  w.onclick=e=>{ if(e.target===w) close(); };
  w.querySelector('.ask-yes').onclick=()=>{
    close();
    Object.keys(S).forEach(k=>S[k]=(k==='flags'||k==='org')?[]:null);
    CK={}; TAB='now'; stack=[]; node='type'; render();
  };
}

function render(){
  document.getElementById('hTitle').textContent =
    node==='result' ? ({fire:'화재사고',water:'누수사고',break:'파손사고',body:'대인사고'}[S.type]||'사고')+' 대응'
                    : '사고 현장 대응 가이드';
  progress(); bindReset();
  if(node==='result') renderResult();
  else if(node==='soon') renderSoon();
  else renderQ();
}
render();

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
